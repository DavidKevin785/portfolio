<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess — Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 antialiased">
    <div class="max-w-5xl mx-auto p-6">
        <header class="mb-6 flex items-center justify-between">
            <h1 class="text-2xl font-semibold">Chess — Play (Hotseat & Network)</h1>
            <div class="text-sm text-gray-300">Use Hotseat for local play or Network to play remotely (manual copy/paste signaling)</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 flex flex-col items-center">
                <div id="board" class="grid grid-cols-8 grid-rows-8 w-96 h-96 border-4 border-gray-700 rounded-lg overflow-hidden shadow-2xl">
                    <!-- squares rendered by JS -->
                </div>
                <div class="mt-4 flex items-center gap-4">
                    <div id="status" class="text-sm text-gray-300"></div>
                    <button id="reset-btn" class="ml-2 px-3 py-1 bg-sky-600 rounded text-white text-sm">Reset</button>
                </div>
            </div>

            <aside class="space-y-4">
                <div class="bg-gray-800 p-4 rounded">
                    <div class="mb-2 font-medium">Mode</div>
                    <div class="flex gap-2">
                        <label class="inline-flex items-center gap-2">
                            <input type="radio" name="mode" value="hotseat" checked id="mode-hotseat" />
                            <span class="text-sm">Hotseat</span>
                        </label>
                        <label class="inline-flex items-center gap-2">
                            <input type="radio" name="mode" value="network" id="mode-network" />
                            <span class="text-sm">Network</span>
                        </label>
                    </div>
                </div>

                <div id="network-panel" class="bg-gray-800 p-4 rounded hidden space-y-3">
                    <div class="font-medium">Network Play</div>
                    <div class="text-sm text-gray-300">Host creates an offer and shares it with a peer. Peer pastes the offer and returns an answer. Manual copy/paste signaling.</div>
                    <div class="flex gap-2">
                        <button id="host-btn" class="px-2 py-1 bg-green-600 rounded text-white text-sm">Host Game</button>
                        <button id="join-btn" class="px-2 py-1 bg-blue-600 rounded text-white text-sm">Join Game</button>
                    </div>
                    <label class="text-xs text-gray-400">Local SDP / Offer</label>
                    <textarea id="local-sdp" class="w-full h-24 bg-gray-900 text-xs p-2 rounded text-gray-200" readonly></textarea>
                    <label class="text-xs text-gray-400">Remote SDP / Paste Offer or Answer</label>
                    <textarea id="remote-sdp" class="w-full h-24 bg-gray-900 text-xs p-2 rounded text-gray-200"></textarea>
                    <div class="flex gap-2">
                        <button id="apply-remote-btn" class="px-2 py-1 bg-sky-600 rounded text-white text-sm">Apply Remote SDP</button>
                        <button id="clear-sdp" class="px-2 py-1 bg-gray-700 rounded text-white text-sm">Clear</button>
                    </div>
                    <div id="net-status" class="text-xs text-gray-400 mt-2">Not connected</div>
                </div>

                <div class="bg-gray-800 p-4 rounded">
                    <div class="font-medium">Move History</div>
                    <ol id="moves" class="text-sm text-gray-300 mt-2 list-decimal list-inside max-h-48 overflow-auto"></ol>
                </div>
            </aside>v 
        </div>
    </div>

    <script>
        // Setup chess.js
        const game = new Chess();

        // DOM elements
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const movesEl = document.getElementById('moves');
        const resetBtn = document.getElementById('reset-btn');

        // Network elements
        const modeNetwork = document.getElementById('mode-network');
        const modeHotseat = document.getElementById('mode-hotseat');
        const networkPanel = document.getElementById('network-panel');
        const hostBtn = document.getElementById('host-btn');
        const joinBtn = document.getElementById('join-btn');
        const localSdp = document.getElementById('local-sdp');
        const remoteSdp = document.getElementById('remote-sdp');
        const applyRemoteBtn = document.getElementById('apply-remote-btn');
        const clearSdpBtn = document.getElementById('clear-sdp');
        const netStatus = document.getElementById('net-status');

        // Network variables
        let pc = null;
        let dc = null;
        let localColor = null; // 'w' or 'b' when networked

        // Unicode piece mapping
        const PIECES = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚'
        };
        const WHITE_PIECES = { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' };

        // Render board squares and pieces
        function renderBoard() {
            boardEl.innerHTML = '';
            const board = game.board(); // array [rank][file] rank 0 = 8th rank
            // We'll render rank 8..1 top to bottom, files a..h left to right
            for (let rank = 0; rank < 8; rank++) {
                for (let file = 0; file < 8; file++) {
                    const squareIndex = { r: rank, f: file };
                    const square = document.createElement('div');
                    const isDark = (rank + file) % 2 === 1;
                    square.className = `flex items-center justify-center select-none ${isDark ? 'bg-slate-700' : 'bg-gray-200'} text-2xl cursor-pointer`;
                    // compute square name
                    const fileChar = String.fromCharCode('a'.charCodeAt(0) + file);
                    const rankNum = 8 - rank;
                    const sq = fileChar + rankNum;
                    square.dataset.square = sq;
                    const piece = board[rank][file];
                    if (piece) {
                        const glyph = piece.color === 'w' ? WHITE_PIECES[piece.type] : PIECES[piece.type];
                        const el = document.createElement('div');
                        // Use a circular background for pieces so they contrast with any square
                        el.textContent = glyph;
                        el.className = 'w-8 h-8 rounded-full flex items-center justify-center text-lg font-semibold shadow';
                        if (piece.color === 'w') {
                            el.classList.add('bg-white', 'text-black');
                        } else {
                            el.classList.add('bg-black', 'text-white');
                        }
                        square.appendChild(el);
                    }
                    boardEl.appendChild(square);
                }
            }
            attachSquareHandlers();
            updateStatus();
            updateMoves();
        }

        let selected = null;

        function attachSquareHandlers() {
            boardEl.querySelectorAll('[data-square]').forEach(sqEl => {
                sqEl.onclick = () => onSquareClick(sqEl.dataset.square);
            });
        }

        function onSquareClick(sq) {
            const piece = game.get(sq);
            // enforce network turn if networked
            if (localColor) {
                if (game.turn() !== localColor) return; // not local player's turn
            }

            if (selected) {
                // try move
                const move = game.move({ from: selected, to: sq, promotion: 'q' });
                selected = null;
                if (move) {
                    renderBoard();
                    if (dc && dc.readyState === 'open') {
                        dc.send(JSON.stringify({ type: 'move', move }));
                    }
                } else {
                    // If clicked on same color piece, reselect
                    if (piece && piece.color === game.turn()) {
                        selected = sq;
                    }
                }
            } else {
                // select piece if it belongs to current turn or hotseat
                if (piece && piece.color === game.turn()) {
                    selected = sq;
                }
            }
            renderBoardHighlights();
        }

        function renderBoardHighlights() {
            // add a subtle ring to selected square and possible moves
            boardEl.querySelectorAll('[data-square]').forEach(el => el.classList.remove('ring-2', 'ring-amber-400'));
            if (!selected) return;
            const moves = game.moves({ square: selected, verbose: true });
            const el = boardEl.querySelector(`[data-square='${selected}']`);
            if (el) el.classList.add('ring-2', 'ring-amber-400');
            moves.forEach(m => {
                const toEl = boardEl.querySelector(`[data-square='${m.to}']`);
                if (toEl) toEl.classList.add('ring-2', 'ring-amber-400');
            });
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                statusEl.textContent = `Checkmate — ${game.turn() === 'w' ? 'Black' : 'White'} wins`;
            } else if (game.in_stalemate()) {
                statusEl.textContent = 'Stalemate — Draw';
            } else if (game.in_check()) {
                statusEl.textContent = `${game.turn() === 'w' ? 'White' : 'Black'} to move — In check`;
            } else {
                statusEl.textContent = `${game.turn() === 'w' ? 'White' : 'Black'} to move`;
            }
        }

        function updateMoves() {
            movesEl.innerHTML = '';
            const history = game.history({ verbose: true });
            for (let i = 0; i < history.length; i += 2) {
                const li = document.createElement('li');
                const white = history[i] ? history[i].san : '';
                const black = history[i + 1] ? history[i + 1].san : '';
                li.textContent = white + (black ? ' ' + black : '');
                movesEl.appendChild(li);
            }
        }

        resetBtn.addEventListener('click', () => {
            game.reset();
            selected = null;
            renderBoard();
        });

        // Mode toggle
        function updateModeUI() {
            if (modeNetwork.checked) {
                networkPanel.classList.remove('hidden');
            } else {
                networkPanel.classList.add('hidden');
                disconnectPeer();
                localColor = null;
                netStatus.textContent = 'Not connected';
            }
        }
        modeNetwork.addEventListener('change', updateModeUI);
        modeHotseat.addEventListener('change', updateModeUI);

        // Network / WebRTC helpers (manual signaling)
        function createPeerConnection(isHost) {
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            pc.onicecandidate = e => {
                if (e.candidate) return; // we'll wait for full SDP
            };
            pc.onconnectionstatechange = () => {
                netStatus.textContent = pc.connectionState;
            };
            if (isHost) {
                dc = pc.createDataChannel('moves');
                setupDataChannel();
            } else {
                pc.ondatachannel = ev => {
                    dc = ev.channel;
                    setupDataChannel();
                };
            }
            pc.oniceconnectionstatechange = () => {
                netStatus.textContent = pc.iceConnectionState;
            };
            return pc;
        }

        function setupDataChannel() {
            dc.onopen = () => {
                netStatus.textContent = 'Connected';
            };
            dc.onmessage = ev => {
                try {
                    const data = JSON.parse(ev.data);
                    if (data.type === 'move') {
                        // apply remote move
                        game.move({ from: data.move.from, to: data.move.to, promotion: data.move.promotion || 'q' });
                        renderBoard();
                    }
                } catch (err) {
                    console.error('Invalid message', err);
                }
            };
            dc.onclose = () => {
                netStatus.textContent = 'Disconnected';
            };
        }

        hostBtn.addEventListener('click', async () => {
            try {
                createPeerConnection(true);
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                localSdp.value = JSON.stringify(pc.localDescription);
                localColor = 'w'; // host plays white by default
                netStatus.textContent = 'Offer created — share with peer';
            } catch (err) {
                console.error(err);
            }
        });

        joinBtn.addEventListener('click', async () => {
            try {
                createPeerConnection(false);
                netStatus.textContent = 'Paste remote offer then click Apply Remote SDP';
                localColor = 'b';
            } catch (err) {
                console.error(err);
            }
        });

        applyRemoteBtn.addEventListener('click', async () => {
            try {
                const text = remoteSdp.value.trim();
                if (!text) return;
                const desc = JSON.parse(text);
                if (!pc) {
                    // likely joining: create PC
                    createPeerConnection(false);
                    localColor = 'b';
                }
                if (desc.type === 'offer') {
                    await pc.setRemoteDescription(desc);
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    localSdp.value = JSON.stringify(pc.localDescription);
                    netStatus.textContent = 'Answer created — send back to host';
                } else if (desc.type === 'answer') {
                    await pc.setRemoteDescription(desc);
                    netStatus.textContent = 'Connected (waiting for DataChannel)';
                }
            } catch (err) {
                console.error(err);
            }
        });

        clearSdpBtn.addEventListener('click', () => {
            localSdp.value = '';
            remoteSdp.value = '';
        });

        function disconnectPeer() {
            if (dc) {
                try { dc.close(); } catch (e) {}
                dc = null;
            }
            if (pc) {
                try { pc.close(); } catch (e) {}
                pc = null;
            }
        }

        // initialize
        renderBoard();

        // expose for debugging (optional)
        window._game = game;
        window._renderBoard = renderBoard;
    </script>
</body>
</html>
